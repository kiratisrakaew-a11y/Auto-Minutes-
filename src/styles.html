<!-- styles.html — CSS ทั้งหมด (self-contained ไม่พึ่ง CDN) — ธีม "Mission Impossible / IMF Terminal" -->
<style>
  :root {
    /* พื้นหลังโทนมืดแบบจอบัญชาการ */
    --bg: #05080f;
    --bg-2: #0a1020;
    --card: rgba(14, 21, 38, .82);
    --card-solid: #0d1526;
    --ink: #e8f0ff;
    --muted: #8291ad;
    --line: rgba(90, 120, 170, .22);
    --line-strong: rgba(120, 160, 220, .38);

    /* accent: cyan เทคโนโลยี + แดง IMF */
    --brand: #23e0d6;          /* teal/cyan tactical */
    --brand-dark: #12b3ab;
    --brand-glow: rgba(35, 224, 214, .35);
    --imf: #ff2d3f;            /* IMF red */
    --imf-glow: rgba(255, 45, 63, .40);

    --ok: #35e08b;
    --warn: #ffc247;
    --danger: #ff4d5e;
    --danger-bg: rgba(255, 45, 63, .12);
    --warn-bg: rgba(255, 194, 71, .12);
    --ok-bg: rgba(53, 224, 139, .12);

    --radius: 4px;
    --shadow: 0 2px 8px rgba(0,0,0,.55), 0 18px 50px rgba(0,0,0,.45);
    --glow-brand: 0 0 0 1px var(--brand-glow), 0 0 22px -6px var(--brand-glow);
    font-family: "Sarabun", "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono: "JetBrains Mono", "SFMono-Regular", "Consolas", "Roboto Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }

  body {
    margin: 0; color: var(--ink); font-size: 15px; line-height: 1.55;
    background:
      radial-gradient(1200px 620px at 78% -8%, rgba(35,224,214,.10), transparent 60%),
      radial-gradient(1000px 560px at 8% 108%, rgba(255,45,63,.10), transparent 60%),
      linear-gradient(180deg, #05080f 0%, #060a14 55%, #04060c 100%);
    background-attachment: fixed;
    min-height: 100vh;
    position: relative;
  }
  /* กริดแทคติคอล + สแกนไลน์บาง ๆ ทับทั้งจอ */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      linear-gradient(rgba(120,160,220,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120,160,220,.045) 1px, transparent 1px);
    background-size: 46px 46px;
    mask-image: radial-gradient(circle at 50% 30%, #000 0%, transparent 85%);
  }
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0) 0 3px, rgba(0,0,0,.16) 3px 4px);
    opacity: .35; mix-blend-mode: multiply;
  }

  #app { max-width: 1060px; margin: 0 auto; padding: 0 16px 64px; position: relative; z-index: 1; }

  ::selection { background: var(--imf); color: #fff; }

  /* Header */
  .app-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 4px 16px; gap: 16px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 6px;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand-mark {
    width: 46px; height: 46px; border-radius: 6px; position: relative;
    background: linear-gradient(150deg, #0e1830, #060b16);
    color: var(--brand); font-weight: 800; display: grid; place-items: center;
    letter-spacing: 1px; font-family: var(--mono);
    border: 1px solid var(--line-strong);
    box-shadow: var(--glow-brand), inset 0 0 18px rgba(35,224,214,.10);
  }
  .brand-mark::after {
    content: ""; position: absolute; inset: -1px; border-radius: 6px;
    border-top: 2px solid var(--imf); border-right: 2px solid var(--imf);
    width: 12px; height: 12px; left: auto; bottom: auto; opacity: .9;
  }
  .brand-title {
    font-weight: 800; font-size: 18px; letter-spacing: .5px;
    text-transform: uppercase;
  }
  .brand-sub { color: var(--muted); font-size: 12px; letter-spacing: .3px; font-family: var(--mono); }
  .user-badge {
    background: rgba(10,16,32,.7); border: 1px solid var(--line); border-radius: 4px;
    padding: 7px 14px; font-size: 12.5px; color: var(--ink); font-family: var(--mono);
    letter-spacing: .3px;
  }
  .user-badge::before { content: "◈ "; color: var(--brand); }
  .user-badge b { color: var(--brand); font-weight: 700; }

  /* Stepper — แถบภารกิจ */
  .stepper {
    display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 22px;
    background: rgba(9,14,28,.7); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 8px; backdrop-filter: blur(4px);
  }
  .step {
    flex: 1; min-width: 120px; border: 1px solid transparent; background: transparent; cursor: pointer;
    padding: 11px 8px; border-radius: 3px; font: inherit; font-size: 13.5px; color: var(--muted);
    display: flex; align-items: center; gap: 8px; justify-content: center; white-space: nowrap;
    letter-spacing: .3px; transition: all .18s ease; position: relative;
  }
  .step:hover:not(:disabled) { background: rgba(35,224,214,.06); color: var(--ink); border-color: var(--line); }
  .step:disabled { cursor: not-allowed; opacity: .4; }
  .step.active {
    background: linear-gradient(180deg, rgba(35,224,214,.16), rgba(35,224,214,.05));
    color: var(--brand); border-color: var(--brand-glow);
    box-shadow: 0 0 18px -6px var(--brand-glow), inset 0 0 0 1px var(--brand-glow);
    text-shadow: 0 0 10px var(--brand-glow);
  }
  .step.active .step-no { background: var(--brand); color: #04121a; box-shadow: 0 0 12px -2px var(--brand-glow); }
  .step-no {
    width: 22px; height: 22px; border-radius: 3px; background: rgba(120,160,220,.14);
    color: var(--muted); display: grid; place-items: center; font-size: 12px; font-weight: 800;
    font-family: var(--mono);
  }

  /* Card — แผงข้อมูล มุม tactical */
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 22px; margin-bottom: 16px; position: relative;
    backdrop-filter: blur(6px);
  }
  .card::before, .card::after {
    content: ""; position: absolute; width: 14px; height: 14px; pointer-events: none;
  }
  .card::before { top: -1px; left: -1px; border-top: 2px solid var(--brand); border-left: 2px solid var(--brand); }
  .card::after  { bottom: -1px; right: -1px; border-bottom: 2px solid var(--brand); border-right: 2px solid var(--brand); }
  .card h2 { margin: 0 0 4px; font-size: 19px; letter-spacing: .3px; }
  .card .card-sub { color: var(--muted); margin: 0 0 16px; font-size: 13px; font-family: var(--mono); }

  /* Page */
  .page { display: none; }
  .page.active { display: block; animation: fade .28s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .page-title {
    font-size: 22px; font-weight: 800; margin: 6px 0 2px; letter-spacing: .4px;
    text-transform: uppercase; position: relative; padding-left: 16px;
  }
  .page-title::before {
    content: ""; position: absolute; left: 0; top: 4px; bottom: 4px; width: 4px;
    background: linear-gradient(180deg, var(--imf), var(--brand)); border-radius: 2px;
    box-shadow: 0 0 12px -2px var(--imf-glow);
  }
  .page-desc { color: var(--muted); margin: 0 0 18px; font-size: 13.5px; }

  /* Forms */
  label.field { display: block; margin-bottom: 14px; }
  label.field > span {
    display: block; font-size: 11.5px; font-weight: 700; margin-bottom: 6px; color: var(--brand);
    text-transform: uppercase; letter-spacing: .8px; font-family: var(--mono);
  }
  input[type=text], input[type=date], input[type=time], input[type=url], textarea, select {
    width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 4px;
    font: inherit; color: var(--ink); background: rgba(6,11,22,.72);
    transition: border-color .15s, box-shadow .15s;
  }
  input::placeholder, textarea::placeholder { color: rgba(130,145,173,.6); }
  input:focus, textarea:focus, select:focus {
    outline: none; border-color: var(--brand);
    box-shadow: 0 0 0 3px var(--brand-glow), inset 0 0 14px rgba(35,224,214,.05);
  }
  textarea { resize: vertical; min-height: 90px; }
  select option { background: var(--card-solid); color: var(--ink); }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0 12px; }
  @media (max-width: 640px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line-strong);
    background: rgba(12,19,36,.8); color: var(--ink); padding: 10px 16px; border-radius: 4px; cursor: pointer;
    font: inherit; font-weight: 600; letter-spacing: .3px; transition: all .16s ease; position: relative;
  }
  .btn:hover { border-color: var(--brand); color: var(--brand); box-shadow: 0 0 16px -6px var(--brand-glow); }
  .btn:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }
  .btn.primary {
    background: linear-gradient(180deg, var(--brand), var(--brand-dark)); border-color: var(--brand);
    color: #04121a; font-weight: 800; text-shadow: none;
    box-shadow: 0 0 20px -6px var(--brand-glow);
  }
  .btn.primary:hover { color: #04121a; box-shadow: 0 0 26px -4px var(--brand-glow); filter: brightness(1.08); }
  .btn.ghost { background: transparent; }
  .btn.danger { color: var(--danger); border-color: rgba(255,45,63,.4); background: rgba(255,45,63,.06); }
  .btn.danger:hover { background: var(--danger-bg); border-color: var(--imf); color: #fff; box-shadow: 0 0 18px -6px var(--imf-glow); }
  .btn.sm { padding: 6px 12px; font-size: 13px; }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
  .btn-row.between { justify-content: space-between; }

  /* Template cards */
  .tpl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap: 14px; }
  .tpl-card {
    border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; background: var(--card);
    display: flex; flex-direction: column; gap: 8px; transition: border-color .16s, box-shadow .16s, transform .16s;
    position: relative; overflow: hidden; backdrop-filter: blur(4px);
  }
  .tpl-card::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--brand), transparent); opacity: 0; transition: opacity .16s;
  }
  .tpl-card:hover { border-color: var(--line-strong); transform: translateY(-2px); box-shadow: var(--shadow); }
  .tpl-card:hover::before { opacity: .7; }
  .tpl-card.selected { border-color: var(--brand); box-shadow: var(--glow-brand); }
  .tpl-card.selected::before { opacity: 1; }
  .tpl-card h3 { margin: 0; font-size: 16px; letter-spacing: .3px; }
  .tpl-meta { display: flex; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: 12px; font-family: var(--mono); }
  .tpl-desc { color: #aeb9cc; font-size: 13.5px; flex: 1; }

  /* Agenda / topic rows */
  .agenda-block { border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 14px; overflow: hidden; background: rgba(9,14,28,.5); }
  .agenda-head { background: rgba(35,224,214,.06); padding: 11px 14px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); }
  .agenda-head input { background: transparent; border: 0; font-weight: 700; padding: 4px; color: var(--ink); }
  .agenda-head input:focus { background: rgba(6,11,22,.8); border: 1px solid var(--line-strong); box-shadow: none; }
  .topic-row { display: grid; grid-template-columns: 70px 1fr 120px 120px auto; gap: 8px; align-items: start;
    padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .topic-row:last-child { border-bottom: 0; }
  .topic-row input.mono { font-variant-numeric: tabular-nums; font-family: var(--mono); }
  @media (max-width: 720px) { .topic-row { grid-template-columns: 1fr 1fr; } }

  /* Transcript preview */
  .tx-line { display: grid; grid-template-columns: 92px 90px 1fr auto; gap: 8px; align-items: start;
    padding: 8px 10px; border-bottom: 1px solid var(--line); }
  .tx-line.excluded { opacity: .38; }
  .tx-time { color: var(--brand); font-size: 13px; font-variant-numeric: tabular-nums; padding-top: 8px; font-family: var(--mono); }
  .tx-speaker input, .tx-text textarea { width: 100%; }
  .tx-text textarea { min-height: 44px; }
  .tx-count { color: var(--muted); font-size: 12px; margin: 6px 2px 0; font-family: var(--mono); }

  /* Summary review */
  .sum-block { border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 14px; background: rgba(9,14,28,.5); }
  .sum-head { padding: 12px 16px; display: flex; align-items: center; justify-content: space-between;
    gap: 10px; border-bottom: 1px solid var(--line); background: rgba(35,224,214,.06); }
  .sum-body { padding: 14px 16px; }
  .sum-field { margin-bottom: 12px; }
  .sum-field > label { font-size: 11.5px; font-weight: 700; display: block; margin-bottom: 5px; color: var(--brand);
    text-transform: uppercase; letter-spacing: .7px; font-family: var(--mono); }

  /* Badges & pills */
  .pill { display: inline-block; padding: 2px 10px; border-radius: 3px; font-size: 11.5px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .6px; font-family: var(--mono); border: 1px solid transparent; }
  .pill.pending { background: rgba(130,145,173,.14); color: var(--muted); border-color: var(--line); }
  .pill.processing { background: rgba(35,224,214,.12); color: var(--brand); border-color: var(--brand-glow); }
  .pill.completed { background: var(--ok-bg); color: var(--ok); border-color: rgba(53,224,139,.35); }
  .pill.failed { background: var(--danger-bg); color: var(--danger); border-color: rgba(255,45,63,.4); }
  .pill.explicit { background: var(--ok-bg); color: var(--ok); border-color: rgba(53,224,139,.35); }
  .pill.inferred { background: var(--warn-bg); color: var(--warn); border-color: rgba(255,194,71,.35); }
  .pill.unknown { background: rgba(130,145,173,.14); color: var(--muted); border-color: var(--line); }

  /* Alerts */
  .alert { border-radius: 4px; padding: 12px 14px; margin: 10px 0; font-size: 13.5px; border: 1px solid transparent;
    position: relative; padding-left: 16px; }
  .alert::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; border-radius: 2px; }
  .alert.error { background: var(--danger-bg); border-color: rgba(255,45,63,.4); color: #ff9aa4; }
  .alert.error::before { background: var(--imf); box-shadow: 0 0 12px -2px var(--imf-glow); }
  .alert.warn { background: var(--warn-bg); border-color: rgba(255,194,71,.35); color: #ffd98a; }
  .alert.warn::before { background: var(--warn); }
  .alert.ok { background: var(--ok-bg); border-color: rgba(53,224,139,.35); color: #8ef0bd; }
  .alert.ok::before { background: var(--ok); }
  .alert ul { margin: 6px 0 0; padding-left: 18px; }

  .muted { color: var(--muted); }
  .hidden, [hidden] { display: none !important; }
  .row-actions { display: flex; gap: 6px; }

  /* Auth / loading */
  .auth-gate { padding: 60px 0; display: grid; place-items: center; }
  .auth-card { max-width: 460px; text-align: center; }
  .auth-card::before, .auth-card::after { display: none; }
  .app-loading { display: grid; place-items: center; gap: 14px; padding: 90px 0; color: var(--muted);
    font-family: var(--mono); letter-spacing: 1px; text-transform: uppercase; font-size: 13px; }
  .spinner {
    width: 40px; height: 40px; border: 2px solid rgba(35,224,214,.15); border-top-color: var(--brand);
    border-right-color: var(--imf); border-radius: 50%; animation: spin 0.8s linear infinite;
    box-shadow: 0 0 22px -6px var(--brand-glow);
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Toast */
  .toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    background: rgba(10,16,32,.96); color: var(--ink); padding: 13px 22px; border-radius: 4px; font-size: 14px;
    box-shadow: var(--shadow); z-index: 50; max-width: 90%; border: 1px solid var(--brand-glow);
    backdrop-filter: blur(6px); letter-spacing: .3px; }
  .toast.err { border-color: var(--imf); box-shadow: 0 0 24px -6px var(--imf-glow), var(--shadow); }
  .toast.ok { border-color: rgba(53,224,139,.5); box-shadow: 0 0 24px -8px rgba(53,224,139,.4), var(--shadow); }

  /* Modal */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(3,6,12,.72); display: grid; place-items: center;
    z-index: 40; padding: 16px; backdrop-filter: blur(3px); }
  .modal { background: var(--card-solid); border-radius: var(--radius); max-width: 560px; width: 100%; padding: 24px;
    box-shadow: var(--shadow); max-height: 90vh; overflow: auto; border: 1px solid var(--line-strong); position: relative; }
  .modal::before { content: ""; position: absolute; top: -1px; left: -1px; width: 16px; height: 16px;
    border-top: 2px solid var(--imf); border-left: 2px solid var(--imf); }
  .modal h3 { margin-top: 0; letter-spacing: .3px; }

  .inline-note { font-size: 12px; color: var(--muted); margin-top: 4px; font-family: var(--mono); }
</style>
